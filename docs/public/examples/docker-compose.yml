# OpenMeshTak Core sample deployment.
# Keep this file, .env and root_encryption_key in the same directory.

name: openmeshtak

services:
  core:
    image: ghcr.io/openmeshtak/openmeshtak:${OPENMESHTAK_VERSION:-latest}
    restart: unless-stopped
    environment:
      PUBLIC_ORIGIN: https://${PUBLIC_HOST:?Set PUBLIC_HOST in .env}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Only the reverse proxy reaches port 8080 below, so its X-Forwarded-For entry is trusted.
      TRUST_PROXY: ${TRUST_PROXY:-true}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
    secrets:
      - root_encryption_key
    volumes:
      - core-data:/server/data
    ports:
      - "127.0.0.1:8080:3000"
      - "8446:8446"
      - "8443:8443"
      - "8089:8089"

secrets:
  root_encryption_key:
    file: ./root_encryption_key

volumes:
  core-data:
